<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La pâtisserie de Coco 🎂</title>
<style>
:root{
  --fur:#8b5a2b; --fur-dark:#5e3a1a; --skin:#f1c79b; --skin-dark:#dfa877;
  --ink:#3b2a1a; --paper:#fffaf0; --accent:#ff8a3d; --good:#43a047;
  --left:clamp(120px,19vw,250px); --right:clamp(170px,17vw,240px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:none;background:#fdf3e3}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* ================= CUISINE ================= */
#kitchen{position:fixed;inset:0;overflow:hidden;background-color:#fdf3e3;
  background-image:linear-gradient(90deg,rgba(150,110,60,.08) 2px,transparent 2px),linear-gradient(rgba(150,110,60,.08) 2px,transparent 2px);
  background-size:56px 56px}
#counter{position:absolute;left:0;right:0;bottom:0;height:30%;
  background:linear-gradient(#d39a5c,#b97a3f 12%,#a8692f);box-shadow:0 -8px 0 #e8b57a inset}
#counter::before{content:'';position:absolute;left:0;right:0;top:-14px;height:18px;border-radius:8px 8px 0 0;
  background:linear-gradient(#f5d7a8,#e2b47a)}
#counter::after{content:'';position:absolute;inset:18px 0 0;opacity:.18;
  background:repeating-linear-gradient(90deg,transparent 0 160px,#5e3a1a 160px 163px)}
.window{position:absolute;top:80px;left:calc(var(--left) + 2vw);width:150px;height:120px;border:10px solid #fff;border-radius:10px;
  background:linear-gradient(#7fd0ff,#c8f0ff);box-shadow:0 4px 12px rgba(0,0,0,.12);overflow:hidden}
.window::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:8px;margin-left:-4px;background:#fff}
.window::after{content:'';position:absolute;top:50%;left:0;right:0;height:8px;margin-top:-4px;background:#fff}
.window .sun{position:absolute;width:36px;height:36px;border-radius:50%;background:#ffd23f;top:12px;right:14px;box-shadow:0 0 20px #ffd23f}
.window .hill{position:absolute;bottom:-30px;left:-20px;width:200px;height:70px;border-radius:50%;background:#6abf4b}
.utensils{position:absolute;top:70px;right:calc(var(--right) + 3vw);font-size:34px;display:flex;gap:10px}
.utensils span{display:inline-block;transform-origin:50% 0;animation:hang 4s ease-in-out infinite}
.utensils span:nth-child(2){animation-delay:-1s}.utensils span:nth-child(3){animation-delay:-2s}
@keyframes hang{50%{transform:rotate(6deg)}}
.utensils::before{content:'';position:absolute;top:-8px;left:-10px;right:-10px;height:6px;border-radius:3px;background:#9e9e9e}

/* ================= EN-TÊTE ================= */
#top{position:absolute;top:0;left:0;right:0;height:56px;z-index:50;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,.08)}
#top h1{font-size:19px;white-space:nowrap}
#steps{display:flex;gap:6px;flex:1;justify-content:center;min-width:0}
#steps .st{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#eee;opacity:.5;
  transition:all .3s;position:relative}
#steps .st.cur{opacity:1;background:#ffe0b2;transform:scale(1.15);box-shadow:0 0 0 3px var(--accent)}
#steps .st.done{opacity:1;background:#c8e6c9}
#steps .st.done::after{content:'✔';position:absolute;right:-3px;bottom:-3px;font-size:11px;background:var(--good);color:#fff;
  width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
#stars{font-weight:800;white-space:nowrap}
.tbtn{width:38px;height:38px;border-radius:12px;background:#fff3e0;font-size:18px;display:grid;place-items:center;
  box-shadow:0 2px 0 #e0c09a;text-decoration:none}
.tbtn:active{transform:translateY(2px);box-shadow:none}

/* ================= COCO ================= */
#coco{position:absolute;left:clamp(4px,1.5vw,30px);bottom:3vh;width:clamp(100px,16vw,200px);z-index:30}
#coco svg{width:100%;height:auto;overflow:visible;display:block}
#coco .fur{fill:var(--fur)}#coco .furDark{fill:var(--fur-dark)}
#coco .skin{fill:var(--skin)}#coco .skinDark{fill:var(--skin-dark)}
#coco .limb{fill:none;stroke:var(--fur);stroke-width:16;stroke-linecap:round}
#coco .tailPath{fill:none;stroke:var(--fur);stroke-width:10;stroke-linecap:round}
#coco .brow{fill:none;stroke:var(--fur-dark);stroke-width:3.2;stroke-linecap:round}
#coco .mouth{fill:none;stroke:#5a1e1e;stroke-width:3;stroke-linecap:round}
#coco .m-open,#coco .m-frown,#coco .m-chew{display:none}
#coco.open .m-smile,#coco.sad .m-smile,#coco.chew .m-smile{display:none}
#coco.open .m-open{display:inline}#coco.sad .m-frown{display:inline}#coco.chew .m-chew{display:inline}
#coco .m-chew{transform-box:fill-box;transform-origin:center;animation:chew .22s infinite alternate}
@keyframes chew{to{transform:scaleY(.3)}}
#coco .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);transition:transform .08s}
#coco.blink .lid{transform:scaleY(1)}
#coco .body{transform-origin:100px 250px;animation:breathe 3s ease-in-out infinite}
#coco .tail{transform-origin:132px 205px;animation:tail 2.4s ease-in-out infinite}
#coco .armL{transform-origin:66px 142px;transition:transform .3s}
#coco .armR{transform-origin:134px 142px;transition:transform .3s}
@keyframes breathe{50%{transform:translateY(2px) scaleY(.985)}}
@keyframes tail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
#coco.jump svg{animation:cjump .7s cubic-bezier(.3,.7,.4,1)}
@keyframes cjump{0%{transform:scale(1.08,.9)}45%{transform:translateY(-70px)}85%{transform:scale(1.06,.92)}100%{transform:none}}
#coco.jump .armL{transform:rotate(130deg)}#coco.jump .armR{transform:rotate(-130deg)}
#coco.shake svg{animation:cshake .12s linear 5}
@keyframes cshake{25%{transform:translateX(-5px) rotate(-3deg)}75%{transform:translateX(5px) rotate(3deg)}}
#coco.shake .brow{transform:translateY(2px)}
#coco.point .armR{transform:rotate(-100deg)}
#coco.chew .armR{transform:rotate(-140deg)}
#bubble{position:absolute;left:8px;bottom:100%;margin-bottom:6px;z-index:40;max-width:min(320px,70vw);width:max-content;
  background:#fff;padding:10px 14px;border-radius:16px;font-weight:700;font-size:16px;line-height:1.3;
  box-shadow:0 6px 20px rgba(0,0,0,.18);transform:scale(0);transform-origin:20% 100%;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#bubble::after{content:'';position:absolute;top:100%;left:40px;border:8px solid transparent;border-top-color:#fff}
#bubble.show{transform:scale(1)}

/* ================= FICHE RECETTE ================= */
#card{position:absolute;top:70px;right:14px;width:var(--right);z-index:20;padding:14px 14px 10px;border-radius:6px;
  background:var(--paper);box-shadow:0 8px 20px rgba(0,0,0,.15);transform:rotate(1.5deg);
  background-image:repeating-linear-gradient(transparent 0 27px,#d7e7f7 27px 28px);display:none}
#card::before{content:'';position:absolute;top:-10px;left:50%;width:70px;height:22px;margin-left:-35px;
  background:rgba(255,235,150,.85);transform:rotate(-3deg)}
#card h2{font-size:16px;margin-bottom:6px}
#card .row{display:flex;align-items:center;gap:6px;font-size:14px;min-height:28px}
#card .row .em{font-size:18px;letter-spacing:1px}
#card .row .em i{font-style:normal;opacity:.25}
#card .row .em i.on{opacity:1}
#card .row .ok{margin-left:auto;font-weight:800}
#card .row.done{color:var(--good)}
#card .row.done .ok::after{content:' ✔'}

/* ================= SCÈNE DE JEU ================= */
#stage{position:absolute;top:64px;bottom:0;left:var(--left);right:calc(var(--right) + 24px);z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding-bottom:3vh}
.hint{background:rgba(255,255,255,.88);padding:8px 14px;border-radius:14px;font-weight:700;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.row-c{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{background:#ffcf4a;color:var(--ink);font-weight:800;font-size:16px;padding:11px 18px;border-radius:14px;box-shadow:0 4px 0 #d9a520;
  transition:transform .1s}
a.btn{text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a520}
.btn.green{background:#66bb6a;color:#fff;box-shadow:0 4px 0 #388e3c}
.btn.red{background:#ef5350;color:#fff;box-shadow:0 4px 0 #b71c1c}
.btn.blue{background:#42a5f5;color:#fff;box-shadow:0 4px 0 #1565c0}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.big{font-size:20px;padding:14px 26px}
.next{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}}

/* Étagère */
.shelf{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:10px 10px 18px;border-radius:10px;width:min(100%,640px);
  background:linear-gradient(transparent calc(50% - 8px),#b97a3f calc(50% - 8px),#b97a3f calc(50% + 0px),transparent calc(50% + 0px)),
             linear-gradient(transparent calc(100% - 10px),#b97a3f calc(100% - 10px))}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;background:rgba(255,255,255,.7);
  box-shadow:0 2px 6px rgba(0,0,0,.1);transition:transform .15s;touch-action:none}
.item:hover{transform:translateY(-4px) rotate(-3deg)}
.item .ie{font-size:clamp(26px,3vw,36px);line-height:1}
.item .il{font-size:11px;font-weight:700}
.ghost{position:fixed;z-index:200;font-size:46px;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 4px rgba(0,0,0,.3))}

/* Saladier en verre (vue en coupe) */
.bowl{position:relative;width:min(300px,52vw);aspect-ratio:1/.62;flex-shrink:0;transition:transform .25s}
.bowl.hover{transform:scale(1.06)}
.bowl .bbody{position:absolute;left:0;right:0;bottom:0;height:86%;border-radius:4% 4% 50% 50%/4% 4% 100% 100%;overflow:hidden;
  background:linear-gradient(90deg,rgba(255,255,255,.55),rgba(210,235,255,.35) 30%,rgba(210,235,255,.35) 70%,rgba(255,255,255,.55));
  border:4px solid rgba(255,255,255,.95);box-shadow:inset 0 -8px 20px rgba(120,170,220,.35),0 10px 18px rgba(0,0,0,.15)}
.bowl .batter{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column-reverse;transition:height .3s}
.bowl .layer{position:relative;width:100%;flex-shrink:0;transition:background 0.2s;transform-origin:50% 100%;animation:layerIn .4s ease-out}
@keyframes layerIn{from{transform:scaleY(0)}}
.bowl .layer .lump{position:absolute;font-size:18px;transform:translate(-50%,-50%);transition:opacity .2s}
.bowl .swirl{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:repeating-conic-gradient(from 0deg at 50% 70%,rgba(255,255,255,.35) 0 12deg,transparent 12deg 30deg)}
.bowl .rim{position:absolute;left:-2%;right:-2%;top:6%;height:16%;border-radius:50%;border:5px solid rgba(255,255,255,.95);
  background:rgba(210,235,255,.25);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.bowl .shine{position:absolute;left:10%;top:30%;width:8%;height:40%;border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none}

.whisk{position:fixed;z-index:150;width:44px;pointer-events:none;transform:translate(-50%,-92%);display:none}
.progress{width:min(320px,70vw);height:18px;border-radius:10px;background:rgba(0,0,0,.12);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
.progress div{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#ffca28,#66bb6a);transition:width .1s}

/* Versement */
.pourzone{position:relative;display:flex;align-items:flex-end;gap:min(9vw,90px);padding-bottom:6px}
.pourzone .bowl{transform-origin:85% 70%;margin-bottom:90px;transition:transform .35s}
.pourzone .bowl.tilt{transform:rotate(58deg)}
.stream{position:absolute;width:14px;border-radius:7px;opacity:0;transition:opacity .15s;z-index:3;
  background:linear-gradient(90deg,rgba(255,255,255,.35),transparent 40%) ,var(--bc)}
.stream.on{opacity:1;animation:wobble .15s infinite alternate}
@keyframes wobble{to{transform:scaleX(.75)}}
.mould{position:relative;width:min(220px,36vw);aspect-ratio:1/.5;border:8px solid #9aa4ad;border-top:none;border-radius:0 0 18px 18px;
  background:linear-gradient(90deg,#d5dbe0,#f4f6f7 30%,#f4f6f7 70%,#d5dbe0);box-shadow:0 8px 14px rgba(0,0,0,.18)}
.mould .mfill{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:0 0 10px 10px;background:var(--bc)}
.mould .band{position:absolute;left:-14px;right:-14px;bottom:78%;height:17%;border-top:3px dashed #43a047;border-bottom:3px dashed #43a047;
  background:rgba(102,187,106,.15)}
.mould .band::after{content:'🎯';position:absolute;right:-30px;top:50%;transform:translateY(-50%);font-size:20px}
.mould .spill{position:absolute;top:-4px;width:16px;border-radius:0 0 8px 8px;background:var(--bc);height:0;transition:height 1s}

/* Four */
.oven{position:relative;width:min(400px,62vw);aspect-ratio:1/.8;border-radius:22px;padding:14px;
  background:linear-gradient(#eceff1,#cfd8dc);box-shadow:0 12px 24px rgba(0,0,0,.25),inset 0 -6px 0 #b0bec5}
.oven .panel{height:18%;display:flex;align-items:center;justify-content:space-around;margin-bottom:10px;border-radius:10px;background:#455a64}
.oven .knob{width:min(44px,7vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(#fafafa,#b0bec5);position:relative;transition:transform .6s;
  box-shadow:0 3px 0 #263238}
.oven .knob::after{content:'';position:absolute;left:50%;top:6%;width:4px;height:35%;margin-left:-2px;border-radius:2px;background:#e53935}
.oven.on .knob.temp{transform:rotate(140deg)}
.oven .display{font-family:'Courier New',monospace;font-weight:800;color:#69f0ae;background:#1b2a30;padding:4px 10px;border-radius:6px;font-size:clamp(13px,2vw,18px)}
.oven .door{position:relative;height:calc(82% - 10px);border-radius:14px;background:#37474f;padding:7%}
.oven .door::before{content:'';position:absolute;top:4%;left:20%;right:20%;height:6%;border-radius:6px;background:#b0bec5;box-shadow:0 3px 0 #78909c}
.oven .win{position:relative;height:100%;border-radius:10px;overflow:hidden;background:#1b1b1b;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10%;
  box-shadow:inset 0 0 0 4px #263238}
.oven.on .win{background:radial-gradient(ellipse at 50% 60%,#ffb74d 0%,#e65100 55%,#3e1a00 100%);animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{filter:brightness(1.15)}}
.oven .rack{position:absolute;left:6%;right:6%;bottom:9%;height:4px;background:#90a4ae}
.oven .heat{position:absolute;bottom:2%;left:8%;right:8%;height:6px;border-radius:3px;background:#5d4037}
.oven.on .heat{background:#ff3d00;box-shadow:0 0 14px #ff6e40}
.bakepan{position:relative;width:62%;aspect-ratio:1/.42;border:6px solid #9aa4ad;border-top:none;border-radius:0 0 12px 12px;background:#cfd8dc}
.bakepan .cfill{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 7px 7px}
.bakepan .dome{position:absolute;left:-3%;right:-3%;bottom:70%;height:10%;border-radius:50% 50% 8% 8%/100% 100% 10% 10%;transition:height .3s}
.gauge{position:relative;width:min(400px,62vw);height:22px;border-radius:11px;overflow:hidden;display:flex;box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
.gauge span{height:100%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.gauge .cursor{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;border-radius:3px;background:#263238;box-shadow:0 0 0 2px #fff;left:0}
.smoke{position:fixed;z-index:60;width:36px;height:36px;border-radius:50%;background:rgba(80,80,80,.55);pointer-events:none;filter:blur(3px);
  animation:smoke 2s ease-out forwards}
@keyframes smoke{to{transform:translate(var(--dx),-160px) scale(3);opacity:0}}

/* Gâteau */
.cakewrap{position:relative;width:min(360px,56vw);padding-top:22%}
.plate{position:absolute;left:-12%;right:-12%;bottom:-7%;height:18%;border-radius:50%;background:radial-gradient(#fff 55%,#e0e0e0);box-shadow:0 8px 14px rgba(0,0,0,.18)}
.cake{position:relative;width:100%;aspect-ratio:1/.5}
.cake .cbody{position:absolute;left:0;right:0;bottom:0;height:80%;border-radius:0 0 50% 50%/0 0 22% 22%;overflow:hidden}
.cake .cbody::after{content:'';position:absolute;inset:0;opacity:.25;
  background:radial-gradient(circle at 20% 40%,#fff 0 2px,transparent 3px) 0 0/24px 20px,radial-gradient(circle at 70% 70%,#000 0 1.5px,transparent 2.5px) 0 0/30px 26px}
.cake .ctop{position:absolute;left:0;right:0;top:-26%;height:52%;border-radius:50%;box-shadow:inset 0 -6px 12px rgba(0,0,0,.12);transition:background .6s}
.cake .drips{position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none}
.cake .drip{position:absolute;top:-2px;width:22px;border-radius:0 0 11px 11px;height:0;transition:height 1.2s ease-out}
.cake .decos{position:absolute;left:0;right:0;top:-26%;height:52%}
.deco{position:absolute;transform:translate(-50%,-70%);font-size:clamp(20px,3vw,30px);line-height:1;pointer-events:none;animation:drop .3s ease-out}
@keyframes drop{from{transform:translate(-50%,-260%);opacity:0}}
.sprinkle{position:absolute;width:9px;height:3px;border-radius:2px;pointer-events:none;transform:translate(-50%,-50%)}
.candle{position:absolute;width:11px;height:clamp(36px,6vw,52px);transform:translate(-50%,-100%);border-radius:3px;pointer-events:none;animation:drop .3s ease-out;
  background:repeating-linear-gradient(-35deg,#fff 0 6px,var(--cc) 6px 11px);box-shadow:inset -2px 0 0 rgba(0,0,0,.12)}
.candle::before{content:'';position:absolute;left:50%;top:-7px;width:2px;height:8px;margin-left:-1px;background:#333}
.candle .flame{position:absolute;left:50%;top:-26px;width:14px;height:22px;margin-left:-7px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 70%,#fff59d 0 25%,#ffb300 50%,#ff6d00 75%,transparent 76%);transform-origin:50% 100%;
  animation:flick .15s infinite alternate;display:none;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 0 8px #ffb300)}
.candle.lit .flame{display:block}
@keyframes flick{to{transform:scale(.88,1.08) rotate(3deg)}}
.palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.85);padding:8px 10px;border-radius:16px;
  box-shadow:0 3px 10px rgba(0,0,0,.1);max-width:100%}
.palette .sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.palette .tool{min-width:40px;height:40px;border-radius:12px;font-size:22px;background:#fff3e0;box-shadow:0 2px 0 #e0c09a;padding:0 6px;font-weight:800}
.palette .tool.sel,.palette .sw.sel{outline:3px solid var(--accent);outline-offset:2px}
.palette .sep{width:2px;background:#eee;align-self:stretch}

.knife{position:fixed;z-index:70;font-size:60px;pointer-events:none;transform:translate(-50%,-50%) rotate(-30deg)}
.slice{position:fixed;z-index:65;width:90px;height:70px;pointer-events:none;clip-path:polygon(0 30%,100% 0,100% 100%,0 100%)}

/* Particules */
.fx{position:fixed;z-index:120;pointer-events:none;transform:translate(-50%,-50%)}
.puff{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);animation:puff 1s ease-out forwards}
@keyframes puff{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(2.4);opacity:0}}
.drop{width:9px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:dropfx .7s ease-out forwards}
@keyframes dropfx{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)));opacity:0}}
.emo{font-size:26px;font-weight:900;animation:float 1.4s ease-out forwards}
@keyframes float{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 110px)) rotate(var(--rot))}}
.confetti{position:fixed;top:-20px;z-index:300;width:10px;height:14px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}

/* Écrans (accueil / résultats) */
.overlay{position:absolute;inset:0;z-index:80;display:grid;place-items:center;background:rgba(60,40,20,.35);padding:70px 14px 14px}
.sheet{background:var(--paper);border-radius:24px;padding:22px;width:min(640px,100%);max-height:100%;overflow:auto;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .4s cubic-bezier(.3,1.6,.5,1);touch-action:pan-y}
.sheet h2{font-size:clamp(22px,4vw,30px);margin-bottom:6px}
.sheet p{margin:6px 0 14px;font-weight:600;color:#6d5a46}
.recipes{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:12px 0}
.rcard{border-radius:18px;padding:14px 8px;background:#fff;box-shadow:0 4px 0 #e6cfa9,0 6px 14px rgba(0,0,0,.08);transition:transform .15s}
.rcard:hover{transform:translateY(-4px) rotate(-1deg)}
.rcard .re{font-size:44px;display:block}
.rcard b{display:block;margin-top:6px;font-size:14px}
.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.mode{padding:10px 14px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #e6cfa9;font-weight:700;font-size:14px}
.mode.sel{background:#ffe0b2;outline:3px solid var(--accent)}
.res{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;text-align:left;margin:12px auto;max-width:360px;font-weight:700}
.bigstars{font-size:clamp(40px,8vw,60px);letter-spacing:6px;margin:8px 0}
.bigstars span{display:inline-block;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.bigstars span.off{filter:grayscale(1);opacity:.3}

/* ================= RESPONSIVE ================= */
@media (max-width:820px),(max-aspect-ratio:1/1){
  :root{--left:0px;--right:0px}
  #top h1{display:none}
  #steps .st{width:30px;height:30px;font-size:15px}
  #card{top:60px;left:8px;right:8px;width:auto;transform:none;padding:6px 10px;display:none;flex-wrap:wrap;gap:2px 12px;background-image:none}
  #card.show{display:flex}
  #card::before{display:none}
  #card h2{width:100%;font-size:14px;margin:0}
  #card .row{font-size:12px;min-height:22px}
  #card .row .em{font-size:14px}
  #stage{top:130px;left:0;right:0;padding-bottom:calc(3vh + 120px)}
  #coco{width:96px;bottom:6px}
  #bubble{font-size:14px;max-width:calc(100vw - 30px)}
  .window,.utensils{display:none}
  .shelf{grid-template-columns:repeat(5,1fr);gap:5px;padding:6px}
  .item .il{font-size:9px}
  .pourzone{gap:4vw}
  .pourzone .bowl{margin-bottom:60px}
}
@media (min-width:821px) and (min-aspect-ratio:1/1){ #card.show{display:block} }

<script>
/* =====================================================================
   OUTILS
   ===================================================================== */
const $ = s => document.querySelector(s);
const stage = $('#stage'), card = $('#card'), bubble = $('#bubble'), cocoEl = $('#coco');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => a.map(v => [Math.random(), v]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function center(e) { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; }
function inside(e, ev, pad = 20) { const r = e.getBoundingClientRect(); return ev.clientX > r.left - pad && ev.clientX < r.right + pad && ev.clientY > r.top - pad && ev.clientY < r.bottom + pad; }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function shade(h, k) { return mix(h, k > 0 ? '#ffffff' : '#000000', Math.abs(k)); }
const store = {
  get() { try { return JSON.parse(localStorage.getItem('coco-patisserie')) || { made: 0, stars: 0, best: 0 }; } catch (e) { return { made: 0, stars: 0, best: 0 }; } },
  set(v) { try { localStorage.setItem('coco-patisserie', JSON.stringify(v)); } catch (e) {} }
};

/* =====================================================================
   SONS (générés, aucun fichier) ET VOIX
   ===================================================================== */
let actx, soundOn = true, voiceOn = true;
function ctx() { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; }
function tone(f1, f2, dur, type = 'sine', vol = .15, delay = 0) {
  if (!soundOn) return;
  try {
    const c = ctx(), t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  } catch (e) {}
}
function noise(dur, vol = .2, freq = 1200, delay = 0, q = 1) {
  if (!soundOn) return;
  try {
    const c = ctx(), t = c.currentTime + delay, n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination); s.start(t);
  } catch (e) {}
}
const sfx = {
  pop()    { tone(500, 900, .1, 'triangle', .1); },
  plop()   { tone(600, 180, .15, 'sine', .2); },
  crack()  { noise(.08, .5, 2500, 0, 3); noise(.06, .4, 1800, .07, 3); tone(400, 200, .1, 'triangle', .05, .1); },
  puff()   { noise(.5, .25, 600, 0, .6); },
  sugar()  { for (let i = 0; i < 6; i++) noise(.03, .2, 5000, i * .04, 4); },
  splash() { noise(.35, .3, 900, 0, 1.2); tone(300, 120, .2, 'sine', .08); },
  wrong()  { tone(220, 140, .25, 'square', .07); tone(180, 110, .3, 'square', .06, .12); },
  good()   { tone(660, 990, .12, 'triangle', .12); tone(990, 1320, .15, 'triangle', .1, .1); },
  stir()   { noise(.12, .12, 700, 0, 2); },
  ding()   { tone(1568, 1560, 1.2, 'sine', .2); tone(2093, 2090, 1, 'sine', .08, .02); },
  tick()   { tone(1200, 1100, .03, 'square', .02); },
  burn()   { noise(.6, .2, 300, 0, .5); },
  match()  { noise(.15, .4, 3000, 0, 2); noise(.4, .15, 800, .1, .8); },
  blow()   { noise(.4, .35, 500, 0, .5); },
  chew()   { for (let i = 0; i < 5; i++) noise(.06, .25, 900, i * .22, 2); },
  tada()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .25, 'triangle', .14, i * .12)); tone(1047, 1047, .7, 'triangle', .12, .5); },
  jingle() { [784, 784, 880, 784, 1047, 988].forEach((f, i) => tone(f, f * 1.01, .22, 'triangle', .12, i * .26)); }
};
let frVoice = null;
function loadVoice() { try { const v = speechSynthesis.getVoices(); frVoice = v.find(x => /^fr/i.test(x.lang) && /female|amelie|julie|hortense|denise/i.test(x.name)) || v.find(x => /^fr/i.test(x.lang)) || null; } catch (e) {} }
if ('speechSynthesis' in window) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function speak(text) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try {
    const clean = text.replace(/[\p{Extended_Pictographic}️‍]/gu, '').replace(/\s+/g, ' ').trim();
    if (!clean) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'fr-FR'; u.rate = 1.05; u.pitch = 1.35; if (frVoice) u.voice = frVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* =====================================================================
   COCO
   ===================================================================== */
let sayTimer, faceTimer;
function say(text, ms) {
  bubble.textContent = text; bubble.classList.add('show');
  clearTimeout(sayTimer); sayTimer = setTimeout(() => bubble.classList.remove('show'), ms || Math.max(2200, text.length * 70));
  speak(text);
}
function coco(mood, ms = 900) {
  ['open', 'sad', 'chew', 'jump', 'shake', 'point'].forEach(c => cocoEl.classList.remove(c));
  void cocoEl.offsetWidth;
  if (mood === 'jump') cocoEl.classList.add('jump', 'open');
  else if (mood === 'shake') cocoEl.classList.add('shake', 'sad');
  else if (mood) cocoEl.classList.add(mood);
  clearTimeout(faceTimer); faceTimer = setTimeout(() => cocoEl.classList.remove('open', 'sad', 'chew', 'jump', 'shake', 'point'), ms);
}
(function blink() { setTimeout(() => { cocoEl.classList.add('blink'); setTimeout(() => cocoEl.classList.remove('blink'), 130); blink(); }, rand(2000, 4500)); })();

function emo(txt, x, y) {
  const p = el('div', 'fx emo', txt); p.style.left = x + 'px'; p.style.top = y + 'px';
  p.style.setProperty('--dx', rand(-50, 50) + 'px'); p.style.setProperty('--rot', rand(-40, 40) + 'deg');
  document.body.appendChild(p); setTimeout(() => p.remove(), 1500);
}
function confetti(n = 80) {
  const cols = ['#ff5252', '#ffca28', '#66bb6a', '#42a5f5', '#ab47bc', '#ff8a65'];
  for (let i = 0; i < n; i++) {
    const c = el('div', 'confetti'); c.style.left = rand(0, 100) + 'vw'; c.style.background = pick(cols);
    c.style.setProperty('--dx', rand(-120, 120) + 'px'); c.style.setProperty('--rot', rand(-720, 720) + 'deg');
    c.style.animationDuration = rand(2, 3.6) + 's'; c.style.animationDelay = rand(0, .6) + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4400);
  }
}

/* =====================================================================
   DONNÉES : INGRÉDIENTS ET RECETTES
   ===================================================================== */
const ING = {
  oeuf:     { e: '🥚', l: 'Œuf',      s: 'œuf', p: 'œufs', de: "d'œufs", c: '#ffd54f', fx: 'egg' },
  farine:   { e: '🌾', l: 'Farine',   s: 'verre de farine', p: 'verres de farine', de: 'de farine', c: '#f7f1e3', fx: 'puff' },
  sucre:    { e: '🍬', l: 'Sucre',    s: 'cuillère de sucre', p: 'cuillères de sucre', de: 'de sucre', c: '#fffefa', fx: 'sugar' },
  lait:     { e: '🥛', l: 'Lait',     s: 'verre de lait', p: 'verres de lait', de: 'de lait', c: '#fdfbf3', fx: 'splash' },
  beurre:   { e: '🧈', l: 'Beurre',   s: 'morceau de beurre', p: 'morceaux de beurre', de: 'de beurre', c: '#ffe58f', fx: 'drop' },
  chocolat: { e: '🍫', l: 'Chocolat', s: 'carré de chocolat', p: 'carrés de chocolat', de: 'de chocolat', c: '#6d3d1e', fx: 'drop', lump: true },
  banane:   { e: '🍌', l: 'Banane',   s: 'banane', p: 'bananes', de: 'de bananes', c: '#fbe7a1', fx: 'drop', lump: true },
  fraise:   { e: '🍓', l: 'Fraise',   s: 'fraise', p: 'fraises', de: 'de fraises', c: '#ef6f6c', fx: 'drop', lump: true },
  citron:   { e: '🍋', l: 'Citron',   s: 'citron', p: 'citrons', de: 'de citron', c: '#fff59d', fx: 'splash', lump: true },
  carotte:  { e: '🥕', l: 'Carotte',  bad: 'Une carotte dans le gâteau ? Je ne suis pas un lapin ! 🐰' },
  poisson:  { e: '🐟', l: 'Poisson',  bad: 'Un poisson ?! Beurk, le gâteau va sentir la mer ! 🤢' },
  chaussette:{ e: '🧦', l: 'Chaussette', bad: 'Une chaussette ?! Hahaha, ça ne se mange pas ! 🤣' },
  piment:   { e: '🌶️', l: 'Piment',   bad: 'Du piment ? Ça va me brûler la langue ! 🔥' },
  fromage:  { e: '🧀', l: 'Fromage',  bad: 'Du fromage ? Pas dans un gâteau sucré ! 😅' },
};
const RECIPES = [
  { id: 'banane', nom: 'Gâteau à la banane',  e: '🍌', batter: '#f1cf7c', ing: { oeuf: 2, farine: 3, sucre: 2, banane: 2, lait: 1 } },
  { id: 'choco',  nom: 'Gâteau au chocolat',  e: '🍫', batter: '#7a4524', ing: { oeuf: 3, farine: 2, sucre: 2, chocolat: 3, beurre: 1 } },
  { id: 'fraise', nom: 'Gâteau à la fraise',  e: '🍓', batter: '#f4b2bd', ing: { oeuf: 2, farine: 3, sucre: 1, fraise: 3, lait: 2 } },
  { id: 'citron', nom: 'Gâteau au citron',    e: '🍋', batter: '#f6e38a', ing: { oeuf: 3, farine: 3, sucre: 2, citron: 1, beurre: 2 } },
];
const GLAZES = [
  { n: 'chocolat', c: '#5a3317' }, { n: 'fraise', c: '#f48fb1' }, { n: 'vanille', c: '#fff4d6' },
  { n: 'citron', c: '#fff176' }, { n: 'menthe', c: '#a5d6a7' }, { n: 'myrtille', c: '#9fa8da' }
];
const DECOS = ['🍓', '🍌', '🍒', '🫐', '🍫', '🌸', '⭐', '✨', '🕯️'];
const STEPS = [
  { icon: '🧺', label: 'Ingrédients' }, { icon: '🥄', label: 'Mélanger' }, { icon: '🫗', label: 'Verser' },
  { icon: '🔥', label: 'Cuisson' }, { icon: '🎨', label: 'Décorer' }, { icon: '🕯️', label: 'Bougies' }, { icon: '😋', label: 'Dégustation' }
];
const RUN = [stepIngredients, stepMix, stepPour, stepBake, stepDecorate, stepCandles, stepEat];

let S = null;       // état de la partie
let mode = 'petit'; // petit chef (images) / grand chef (chiffres)
let loops = [];     // boucles d'animation de l'étape en cours
function stopLoops() { loops.forEach(cancelAnimationFrame); loops = []; }

/* =====================================================================
   EN-TÊTE, FICHE RECETTE, NAVIGATION
   ===================================================================== */
function renderSteps() {
  const box = $('#steps'); box.innerHTML = '';
  STEPS.forEach((s, i) => {
    const d = el('div', 'st', s.icon); d.title = s.label;
    if (S && i < S.step) d.classList.add('done');
    if (S && i === S.step) d.classList.add('cur');
    box.appendChild(d);
  });
  const tot = S ? S.stars.reduce((a, b) => a + (b || 0), 0) : 0;
  $('#stars').textContent = '⭐ ' + tot;
}
function renderCard() {
  if (!S) { card.classList.remove('show'); return; }
  card.classList.add('show');
  const r = S.recipe;
  let h = `<h2>📜 ${r.nom}</h2>`;
  for (const [id, n] of Object.entries(r.ing)) {
    const g = ING[id], c = S.counts[id] || 0;
    const em = mode === 'petit'
      ? Array.from({ length: n }, (_, i) => `<i class="${i < c ? 'on' : ''}">${g.e}</i>`).join('')
      : `${g.e} <b>× ${n}</b>`;
    h += `<div class="row ${c >= n ? 'done' : ''}"><span class="em">${em}</span>${mode === 'petit' ? '' : `<span>${n > 1 ? g.p : g.s}</span>`}<span class="ok">${c}/${n}</span></div>`;
  }
  card.innerHTML = h;
}
function goStep(i) {
  stopLoops();
  S.step = i;
  renderSteps(); renderCard();
  stage.innerHTML = '';
  RUN[i]();
}
function nextButton(label, onClick) {
  const b = el('button', 'btn green big next', label);
  b.onclick = () => { sfx.pop(); onClick ? onClick() : goStep(S.step + 1); };
  return b;
}
function award(stars) { S.stars[S.step] = stars; renderSteps(); }

/* =====================================================================
   SALADIER
   ===================================================================== */
function makeBowl() {
  const b = el('div', 'bowl', '<div class="bbody"><div class="batter"></div><div class="swirl"></div></div><div class="rim"></div><div class="shine"></div>');
  return b;
}
function bowlTotalUnits() { return Object.values(S.recipe.ing).reduce((a, b) => a + b, 0); }
function addLayer(id) {
  const g = ING[id], unit = 66 / bowlTotalUnits();
  const L = el('div', 'layer'); L.style.height = unit + '%';
  const batter = S.bowl.querySelector('.batter'); batter.style.height = '100%';

function stepMix() {
  const bowl = S.bowl; bowl.classList.remove('hover');

  const bar = el('div', 'progress', '<div></div>'), fill = bar.firstChild;
  const hold = el('button', 'btn blue', '🌀 Maintenir pour mélanger');
  const next = nextButton('Verser dans le moule 🫗 ➜'); next.style.display = 'none';
  stage.append(el('div', 'hint', '🥄 Tourne en rond dans le saladier avec la souris ou le doigt !'), bowl, bar, el('div', 'row-c'));
  stage.lastChild.append(hold, next);
  const whisk = $('#whisk');
  const swirl = bowl.querySelector('.swirl');
  let acc = 0, last = null, mixing = false, holding = false, holdAng = 0, said = 0, tickAcc = 0, t0 = performance.now(), done = false;
  const TARGET = Math.PI * 2 * 5;

  function render() {
    const p = clamp(acc / TARGET, 0, 1);
    fill.style.width = p * 100 + '%';
    S.layers.forEach(L => {
      L.style.background = mix(L.dataset.c, S.recipe.batter, p);
      if (p > .2) L.style.backgroundImage = 'none';
      L.querySelectorAll('.lump').forEach(s => { s.style.opacity = 1 - p * 1.1; s.style.transform = `translate(-50%,-50%) scale(${1 - p * .7}) rotate(${acc * 40}deg)`; });
    });
    swirl.style.opacity = p < 1 ? .25 + p * .4 : 0;
    swirl.style.transform = `rotate(${acc * 57}deg)`;
    if (p > .3 && said === 0) { said = 1; say('Continue de tourner ! 🌀'); }
    if (p > .7 && said === 1) { said = 2; say('Presque ! La pâte devient toute lisse ! 😋'); coco('open', 600); }
    if (p >= 1 && !done) finish();
  }
  function addAngle(a) {

  }
  function finish() {
    done = true; mixing = holding = false; whisk.style.display = 'none';
    // les couches deviennent une seule pâte
    const batter = bowl.querySelector('.batter'); batter.innerHTML = '';
    const L = el('div', 'layer'); L.style.height = '66%'; L.style.background = S.recipe.batter; L.dataset.c = S.recipe.batter;
    batter.appendChild(L); S.layers = [L];

    hold.style.display = 'none'; next.style.display = '';

  bowl.addEventListener('pointermove', e => { if (!mixing) return; moveW(e); });
  const stopMix = () => { mixing = false; if (!holding) whisk.style.display = 'none'; };
  bowl.addEventListener('pointerup', stopMix); bowl.addEventListener('pointercancel', stopMix);
  function moveW(e) {
    whisk.style.left = e.clientX + 'px'; whisk.style.top = e.clientY + 'px';
    const c = center(bowl.querySelector('.bbody'));
    const dx = e.clientX - c.x, dy = e.clientY - c.y;
    whisk.style.transform = `translate(-50%,-92%) rotate(${clamp(dx / 6, -25, 25)}deg)`;

  }

  const startHold = () => { if (done) return; holding = true; whisk.style.display = 'block'; last = null; };
  const endHold = () => { holding = false; whisk.style.display = 'none'; };
  hold.addEventListener('pointerdown', startHold); hold.addEventListener('pointerup', endHold); hold.addEventListener('pointerleave', endHold);
  S.keyDown = e => { if (e.code === 'Space') { e.preventDefault(); startHold(); } };
  S.keyUp = e => { if (e.code === 'Space') endHold(); };
  let lastHT = performance.now();
  (function loop() {
    const tn = performance.now(), hdt = Math.min(.1, (tn - lastHT) / 1000); lastHT = tn;

      const c = center(bowl.querySelector('.bbody'));

    loops.push(requestAnimationFrame(loop));
  })();
  say('À toi de mélanger ! Tourne, tourne, tourne dans le saladier ! 🌀', 4000);
}

function stepPour() {
  const bowl = S.bowl; bowl.style.width = 'min(240px,40vw)';
  const zone = el('div', 'pourzone');

  zone.style.setProperty('--bc', S.recipe.batter);
  zone.append(bowl, mould, stream);
  const hold = el('button', 'btn blue big', '🫗 Maintenir pour verser');
  const next = nextButton('Au four 🔥 ➜'); next.disabled = true;
  stage.append(el('div', 'hint', '🎯 Verse la pâte jusqu\'à la zone verte, puis lâche !'), zone, el('div', 'row-c'));
  stage.lastChild.append(hold, next);
  const mfill = mould.querySelector('.mfill'), batter = bowl.querySelector('.batter');
  let fill = 0, pouring = false, lastT = performance.now(), spilled = false, warned = false;

  function placeStream() {
    const zr = zone.getBoundingClientRect(), br = bowl.getBoundingClientRect(), mr = mould.getBoundingClientRect();
    const sx = br.right - zr.left - 8, top = br.top + br.height * .55 - zr.top;
    const bottom = mr.top - zr.top + mr.height * (1 - Math.min(fill, 100) / 100);
    stream.style.left = clamp(sx, mr.left - zr.left + 12, mr.right - zr.left - 30) + 'px';
    stream.style.top = top + 'px'; stream.style.height = Math.max(0, bottom - top) + 'px';
  }

  const stop = () => {
    if (!pouring) return; pouring = false; bowl.classList.remove('tilt'); stream.classList.remove('on');
    if (fill >= 78 && fill <= 95) { sfx.good(); coco('jump', 1000); say('Pile dans la zone verte ! Parfait ! 🎯'); }
    else if (fill < 60) say('Encore un peu de pâte ! 🫗');
    else if (fill < 78) say('Ça va, mais tu peux en mettre encore un petit peu !');
    else if (!spilled) say('Hop, c\'est bien rempli ! 😅');
    next.disabled = fill < 60;
  };
  hold.addEventListener('pointerdown', start); hold.addEventListener('pointerup', stop); hold.addEventListener('pointerleave', stop);
  bowl.addEventListener('pointerdown', start); bowl.addEventListener('pointerup', stop);
  S.keyDown = e => { if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) start(); } };
  S.keyUp = e => { if (e.code === 'Space') stop(); };
  next.onclick = () => {
    sfx.pop();
    award(spilled ? 1 : fill >= 78 && fill <= 95 ? 3 : fill >= 65 ? 2 : 1);
    S.fill = fill; goStep(3);
  };
  (function loop(t) {
    const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
    if (pouring && stream.classList.contains('on')) {
      fill += 24 * dt * (fill > 70 ? .7 : 1);
      if (Math.random() < .2) sfx.stir();
      if (fill > 100 && !spilled) {
        spilled = true; sfx.splash(); coco('shake', 1200); say('Oh non, ça déborde ! 😱');
        mould.querySelectorAll('.spill').forEach(s => s.style.height = '70px');
      }

  })(performance.now());

}

/* =====================================================================
   ÉTAPE 4 : LA CUISSON
   ===================================================================== */
function bakeColor(b) {
  const stops = [[0, S.recipe.batter], [.6, S.recipe.id === 'choco' ? '#5d3018' : '#dca24b'], [.8, S.recipe.id === 'choco' ? '#3a1e0f' : '#8d5524'], [1, '#231812']];
  for (let i = 1; i < stops.length; i++) if (b <= stops[i][0]) {
    const [a0, c0] = stops[i - 1], [a1, c1] = stops[i];
    return mix(c0, c1, (b - a0) / (a1 - a0));
  }
  return stops[stops.length - 1][1];
}

function stepBake() {

    <div class="door"><div class="win"><div class="rack"></div><div class="heat"></div>
      <div class="bakepan"><div class="cfill"></div><div class="dome"></div></div></div></div>`);
  const gauge = el('div', 'gauge', `
    <span style="width:45%;background:#f3d27a;color:#6d5a46">CRU</span><span style="width:10%;background:#ffb74d">·</span>
    <span style="width:17%;background:#43a047">PARFAIT</span><span style="width:10%;background:#ef6c00">·</span>
    <span style="width:18%;background:#3e2723">BRÛLÉ</span><div class="cursor"></div>`);
  const go = el('button', 'btn red big', '🔥 Allumer le four');
  stage.append(el('div', 'hint', '⏱️ Surveille la cuisson et sors le gâteau quand le curseur est dans le VERT !'), oven, gauge, el('div', 'row-c'));
  stage.lastChild.append(go);
  const cfill = oven.querySelector('.cfill'), dome = oven.querySelector('.dome'), disp = oven.querySelector('.display'), cur = gauge.querySelector('.cursor');

    const rise = clamp(b / .6, 0, 1) * (b > .85 ? .9 : 1);

    cur.style.left = (b * 100) + '%';
    const secs = Math.round(b * 30);
    disp.textContent = on ? `180° ${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}` : '--:--';
  }

  go.onclick = () => {

    takeOut();
  };
  function takeOut() {

    S.bake = b; S.bakeLabel = bakeLabel(b);
    const st = { 'parfait': 3, 'pâle': 2, 'bien cuit': 2, 'cru': 1, 'brûlé': 1 }[S.bakeLabel];
    award(st);
    const lines = {
      'parfait': 'Parfait ! Il est tout doré et ça sent trop bon ! 🤩',
      'pâle': 'Il est un peu pâle, mais il est cuit ! 🙂',
      'bien cuit': 'Il est bien cuit, presque un peu trop ! 😅',
      'cru': 'Oups, il est encore un peu cru au milieu... 😬',

    loops.push(requestAnimationFrame(loop));

    sw.onclick = () => {
      pal.querySelectorAll('.sw').forEach(x => x.classList.remove('sel')); sw.classList.add('sel');
      S.glaze = g; top.style.background = `radial-gradient(ellipse at 45% 40%,${shade(g.c, .25)},${g.c})`; top.style.boxShadow = '';
      drips.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const d = el('div', 'drip'); d.style.left = (4 + i * 11 + rand(-3, 3)) + '%'; d.style.background = g.c; d.style.width = rand(16, 28) + 'px';
        drips.appendChild(d); setTimeout(() => d.style.height = rand(14, 40) + 'px', 30 + i * 60);
      }
      sfx.splash(); coco('open', 600); say(`Glaçage ${g.n} ! Miam ! 😋`);
    };
    pal.appendChild(sw);
  });
  pal.appendChild(el('div', 'sep'));
  DECOS.forEach(d => {
    const b = el('button', 'tool' + (d === tool ? ' sel' : ''), d);
    b.onclick = () => { tool = d; pal.querySelectorAll('.tool').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sfx.pop(); };
    pal.appendChild(b);
  });
  const undo = el('button', 'tool', '↩️'); undo.title = 'Annuler';
  undo.onclick = () => { const last = S.decos.pop(); if (last) { last.els.forEach(e => e.remove()); updateCount(); sfx.pop(); } };
  pal.appendChild(undo);
  const counter = el('div', 'hint');
  const next = nextButton('Allumer les bougies 🕯️ ➜', () => {
    const n = candles();
    award(n === S.candleGoal ? (S.decos.length - n >= 3 && S.glaze ? 3 : 2) : 1);
    if (n !== S.candleGoal) say(n < S.candleGoal ? `Il manquait des bougies, mais ce n'est pas grave ! 😉` : `Il y a ${n} bougies au lieu de ${S.candleGoal}, ce n'est pas grave ! 😉`);
    goStep(5);
  });
  stage.append(counter, wrap, pal, el('div', 'row-c'));
  stage.lastChild.append(next);
  const candles = () => S.decos.filter(d => d.type === 'candle').length;
  function updateCount() {
    const n = candles();
    counter.innerHTML = `🎨 Choisis un glaçage, puis clique sur le gâteau pour décorer • 🕯️ Bougies : <b style="color:${n === S.candleGoal ? '#43a047' : n > S.candleGoal ? '#e53935' : 'inherit'}">${n} / ${S.candleGoal}</b>`;
  }
  updateCount();
  cake.addEventListener('pointerdown', e => {
    if (!S || S.step !== 4) return;
    const r = top.getBoundingClientRect();
    const rx = r.width / 2, ry = r.height / 2, dx = e.clientX - (r.left + rx), dy = e.clientY - (r.top + ry);
    if ((dx * dx) / (rx * rx) + (dy * dy) / (ry * ry) > .82) return say('Pose la décoration sur le dessus du gâteau ! 👆');
    const lx = (e.clientX - r.left) / r.width * 100, ly = (e.clientY - r.top) / r.height * 100;
    const item = { type: tool === '🕯️' ? 'candle' : tool === '✨' ? 'sprinkles' : 'deco', els: [] };
    if (item.type === 'candle') {
      const c = el('div', 'candle', '<div class="flame"></div>');
      c.style.setProperty('--cc', pick(['#ef5350', '#42a5f5', '#66bb6a', '#ab47bc', '#ffca28', '#ff7043']));
      c.style.left = lx + '%'; c.style.top = ly + '%'; c.style.zIndex = Math.round(ly);
      decos.appendChild(c); item.els.push(c);
      const n = candles() + 1;
      if (n === S.candleGoal) { sfx.good(); coco('jump'); say(`${n} bougies, c'est parfait ! 🕯️`); }
      else if (n > S.candleGoal) { sfx.wrong(); coco('shake'); say(`Oups, trop de bougies ! Il en faut ${S.candleGoal}. Utilise ↩️ pour en enlever.`); }
      else { sfx.pop(); say(`${n} !`); }
    } else if (item.type === 'sprinkles') {
      for (let i = 0; i < 14; i++) {
        const a = rand(0, Math.PI * 2), d = rand(0, 14);
        const sx = clamp(lx + Math.cos(a) * d, 8, 92), sy = clamp(ly + Math.sin(a) * d * .6, 10, 90);
        const s = el('div', 'sprinkle'); s.style.left = sx + '%'; s.style.top = sy + '%';
        s.style.background = pick(['#ff5252', '#ffca28', '#66bb6a', '#42a5f5', '#ab47bc', '#fff']);
        s.style.transform = `translate(-50%,-50%) rotate(${rand(0, 180)}deg)`; decos.appendChild(s); item.els.push(s);
      }
      sfx.sugar();
    } else {
      const d = el('div', 'deco', tool); d.style.left = lx + '%'; d.style.top = ly + '%'; d.style.zIndex = Math.round(ly);
      decos.appendChild(d); item.els.push(d); sfx.plop();
      if (Math.random() < .25) say(pick(['Joli ! 😍', 'Trop beau ! ✨', 'Miam, ça a l\'air bon !', 'Quel artiste ! 🎨']));
    }
    S.decos.push(item); updateCount();
  });
  say(`À toi de décorer ! Choisis un glaçage, ajoute des fruits, et mets ${S.candleGoal} bougies ! 🎨`, 5000);
  coco('point', 2000);
}

/* =====================================================================
   ÉTAPE 6 : LES BOUGIES
   ===================================================================== */
async function stepCandles() {
  const wrap = S.cakeEl; stage.append(el('div', 'hint', '🎂 Fais un vœu...'), wrap, el('div', 'row-c'));
  const row = stage.lastChild, hint = stage.firstChild;
  let list = [...wrap.querySelectorAll('.candle')];
  if (!list.length) {
    say('Tu n\'as pas mis de bougie ! Je t\'en mets une. 🕯️');
    const c = el('div', 'candle', '<div class="flame"></div>'); c.style.setProperty('--cc', '#ef5350');
    c.style.left = '50%'; c.style.top = '50%'; wrap.querySelector('.decos').appendChild(c); list = [c];
    await sleep(1500);
  }
  say('Je les allume avec une allumette... 🔥', 2500); coco('point', 2500);
  for (const c of list) { await sleep(350); c.classList.add('lit'); sfx.match(); }
  await sleep(500);
  hint.textContent = '💨 Souffle les bougies ! Clique sur les flammes, maintiens le bouton, ou souffle dans le micro 🎤';
  say('Fais un vœu et souffle les bougies ! 🎂', 3500);
  const blowBtn = el('button', 'btn blue big', '💨 Maintenir pour souffler');
  const micBtn = el('button', 'btn', '🎤 Souffler dans le micro');
  row.append(blowBtn, micBtn);
  let finished = false, holdTimer = null, micStop = null;
  const lit = () => list.filter(c => c.classList.contains('lit'));
  function blowOut(c) {
    if (!c.classList.contains('lit')) return;
    c.classList.remove('lit'); sfx.blow();
    const r = c.getBoundingClientRect(); const s = el('div', 'smoke'); s.style.left = r.left + r.width / 2 - 18 + 'px'; s.style.top = r.top - 40 + 'px';
    s.style.width = s.style.height = '18px'; s.style.setProperty('--dx', rand(-20, 20) + 'px'); document.body.appendChild(s); setTimeout(() => s.remove(), 2000);
    if (!lit().length) done();
  }
  list.forEach(c => c.querySelector('.flame').addEventListener('pointerdown', e => { e.stopPropagation(); blowOut(c); }));
  blowBtn.addEventListener('pointerdown', () => { coco('open', 3000); holdTimer = setInterval(() => { const l = lit(); if (l.length) blowOut(pick(l)); }, 260); });
  const endHold = () => { clearInterval(holdTimer); };
  blowBtn.addEventListener('pointerup', endHold); blowBtn.addEventListener('pointerleave', endHold);
  micBtn.onclick = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const c = ctx(), src = c.createMediaStreamSource(stream), an = c.createAnalyser(); an.fftSize = 512; src.connect(an);
      const data = new Uint8Array(an.fftSize); let loud = 0, lastBlow = 0;
      micBtn.textContent = '🎤 Souffle fort !'; micBtn.disabled = true;
      micStop = () => stream.getTracks().forEach(t => t.stop());
      (function listen(t) {
        if (finished) return micStop();
        an.getByteTimeDomainData(data);
        let sum = 0; for (const v of data) sum += ((v - 128) / 128) ** 2;
        const rms = Math.sqrt(sum / data.length);
        loud = rms > .16 ? loud + 1 : 0;
        if (loud > 4 && t - lastBlow > 180) { lastBlow = t; const l = lit(); if (l.length) blowOut(pick(l)); coco('open', 500); }
        requestAnimationFrame(listen);
      })(0);
    } catch (e) { say('Pas de micro ? Pas grave, clique sur les flammes ! 😉'); micBtn.disabled = true; }
  };
  function done() {
    if (finished) return; finished = true; clearInterval(holdTimer); if (micStop) micStop();
    award(3); sfx.jingle(); confetti(120); coco('jump', 1500);
    say('Bravo ! Toutes les bougies sont éteintes ! Joyeux anniversaire ! 🎉🥳', 4000);
    hint.textContent = '🎉 Bravo !';
    row.innerHTML = ''; row.append(nextButton('On le goûte ? 😋 ➜'));
  }
}

/* =====================================================================
   ÉTAPE 7 : LA DÉGUSTATION
   ===================================================================== */
async function stepEat() {
  const wrap = S.cakeEl; stage.append(wrap);
  say('Je coupe une belle part... 🔪', 2500);
  await sleep(600);
  const c = center(wrap.querySelector('.cake'));
  const knife = el('div', 'knife', '🔪'); knife.style.left = c.x + 'px'; knife.style.top = c.r.top - 80 + 'px'; document.body.appendChild(knife);
  await knife.animate([{ top: c.r.top - 80 + 'px' }, { top: c.y + 10 + 'px' }, { top: c.r.top - 80 + 'px' }], { duration: 900, easing: 'ease-in-out' }).finished;
  noise(.3, .2, 1500, 0, 2); knife.remove();
  const col = bakeColor(S.bake), gl = S.glaze ? S.glaze.c : shade(col, .15);
  const slice = el('div', 'slice'); slice.style.background = `linear-gradient(${gl} 0 22%,${col} 22%)`;
  slice.style.left = c.x - 45 + 'px'; slice.style.top = c.y - 40 + 'px'; document.body.appendChild(slice);
  const cc = center(cocoEl);
  await slice.animate([{ transform: 'none' }, { transform: `translate(${cc.x - c.x}px, ${cc.y - c.y - 20}px) scale(.6) rotate(-20deg)` }], { duration: 900, easing: 'ease-in-out', fill: 'forwards' }).finished;
  coco('chew', 2600); sfx.chew();
  for (let i = 0; i < 6; i++) setTimeout(() => emo(pick(['😋', '❤️', '✨', 'Miam']), cc.x + rand(-40, 40), cc.y - 60), i * 250);
  slice.animate([{ opacity: 1 }, { opacity: 0, transform: `translate(${cc.x - c.x}px, ${cc.y - c.y - 20}px) scale(.1)` }], { duration: 2400, fill: 'forwards' });
  await sleep(2700); slice.remove();
  const lines = {
    'parfait': 'Mmmmh ! C\'est le meilleur gâteau du monde ! Tu es un vrai chef ! 🤩',
    'pâle': 'Miam ! Il est tout moelleux ! 😋',
    'bien cuit': 'Il est bien croustillant ! J\'adore ! 😄',
    'cru': 'Hmm... c\'est un peu mou au milieu, mais c\'est bon quand même ! 😅',
    'brûlé': 'Kof kof... c\'est un peu croustillant... mais merci quand même ! 😬'
  };
  award(S.bakeLabel === 'parfait' ? 3 : S.bakeLabel === 'brûlé' || S.bakeLabel === 'cru' ? 1 : 2);
  say(lines[S.bakeLabel], 4500);
  coco(S.bakeLabel === 'brûlé' ? 'shake' : 'jump', 1500);
  await sleep(3200);
  showResults();
}

/* =====================================================================
   RÉSULTATS ET ACCUEIL
   ===================================================================== */
function showResults() {
  S.step = 7; renderSteps();
  const tot = S.stars.reduce((a, b) => a + (b || 0), 0), max = STEPS.length * 3, ratio = tot / max;
  const big = ratio >= .85 ? 3 : ratio >= .6 ? 2 : 1;
  const st = store.get(); st.made++; st.stars += tot; st.best = Math.max(st.best, tot); store.set(st);
  const ov = el('div', 'overlay');
  const rows = STEPS.map((s, i) => `<span>${s.icon}</span><span>${s.label}</span><span>${'⭐'.repeat(S.stars[i] || 0)}${'☆'.repeat(3 - (S.stars[i] || 0))}</span>`).join('');
  ov.innerHTML = `<div class="sheet">
    <h2>${big === 3 ? '🏆 Bravo, grand chef !' : big === 2 ? '👏 Très bien, chef !' : '🙂 Bien joué, petit chef !'}</h2>
    <div class="bigstars">${[1, 2, 3].map(i => `<span class="${i <= big ? '' : 'off'}" style="animation-delay:${i * .25}s">⭐</span>`).join('')}</div>
    <p>${S.recipe.e} ${S.recipe.nom} • ${tot} / ${max} étoiles</p>
    <div class="res">${rows}</div>
    <p>🎂 Gâteaux préparés : <b>${st.made}</b> • Record : <b>${st.best}</b> ⭐</p>
    <div class="row-c"><button class="btn green big" id="again">🎂 Un autre gâteau</button><a class="btn" href="/">🏠 Retour chez Coco</a></div>
  </div>`;
  document.body.appendChild(ov);
  if (big === 3) { sfx.tada(); confetti(150); }
  say(big === 3 ? 'Waouh ! Trois étoiles ! Tu es le meilleur pâtissier ! 🏆' : 'Merci pour ce délicieux gâteau ! On en refait un ? 🎂', 4000);
  ov.querySelector('#again').onclick = () => { ov.remove(); showHome(); };
}
function showHome() {
  stopLoops(); S = null; stage.innerHTML = ''; renderSteps(); renderCard();
  const st = store.get();
  const ov = el('div', 'overlay');
  ov.innerHTML = `<div class="sheet">
    <h2>🎂 La pâtisserie de Coco</h2>
    <p>Aide Coco à préparer un délicieux gâteau : choisis les ingrédients, mélange, fais cuire, décore et souffle les bougies !</p>
    <div class="modes">
      <button class="mode ${mode === 'petit' ? 'sel' : ''}" data-m="petit">🐣 Petit chef<br><small>la recette montre les images</small></button>
      <button class="mode ${mode === 'grand' ? 'sel' : ''}" data-m="grand">👨‍🍳 Grand chef<br><small>la recette montre les chiffres</small></button>
    </div>
    <div class="recipes">${RECIPES.map(r => `<button class="rcard" data-r="${r.id}"><span class="re">${r.e}</span><b>${r.nom}</b></button>`).join('')}
      <button class="rcard" data-r="hasard"><span class="re">🎲</span><b>Au hasard !</b></button></div>
    ${st.made ? `<p>🎂 Gâteaux déjà préparés : <b>${st.made}</b> • Record : <b>${st.best}</b> ⭐</p>` : ''}
  </div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('.mode').forEach(b => b.onclick = () => {
    mode = b.dataset.m; ov.querySelectorAll('.mode').forEach(x => x.classList.toggle('sel', x === b)); sfx.pop();
  });
  ov.querySelectorAll('.rcard').forEach(b => b.onclick = () => {
    ctx(); sfx.good();
    const r = b.dataset.r === 'hasard' ? pick(RECIPES) : RECIPES.find(x => x.id === b.dataset.r);
    ov.remove();
    S = { recipe: r, step: 0, counts: {}, order: [], errors: 0, stars: [], layers: [], fill: 0, bake: 0, bakeLabel: '', glaze: null, decos: [], candleGoal: 3 + Math.floor(Math.random() * 4), cakeEl: null };
    goStep(0);
  });
  setTimeout(() => say('Bonjour ! Je suis Coco, le chef pâtissier ! Quel gâteau on prépare ? 🧁', 4000), 400);
  coco('jump', 1200);
}

/* =====================================================================
   COMMANDES GLOBALES
   ===================================================================== */
addEventListener('keydown', e => { if (S && S.keyDown) S.keyDown(e); });
addEventListener('keyup', e => { if (S && S.keyUp) S.keyUp(e); });
$('#soundBtn').onclick = () => { soundOn = !soundOn; $('#soundBtn').textContent = soundOn ? '🔊' : '🔇'; };
$('#voiceBtn').onclick = () => {
  voiceOn = !voiceOn; $('#voiceBtn').textContent = voiceOn ? '🗣️' : '🤐';
  if (!voiceOn) try { speechSynthesis.cancel(); } catch (e) {}
};
cocoEl.addEventListener('pointerdown', () => { coco('jump', 900); tone(320, 520, .15, 'triangle', .15); say(pick(['Hihi ! 😄', 'On cuisine ensemble ! 👨‍🍳', 'J\'ai hâte de goûter ! 😋', 'Ouh ouh ah ah ! 🐒'])); });

renderSteps();
showHome();
</script>
